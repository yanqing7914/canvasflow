name: Codex Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    name: resolve-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.metadata.outputs.number }}
      head-repository: ${{ steps.metadata.outputs.head-repository }}
      base-sha: ${{ steps.metadata.outputs.base-sha }}
      head-sha: ${{ steps.metadata.outputs.head-sha }}
      base-ref: ${{ steps.metadata.outputs.base-ref }}
      draft: ${{ steps.metadata.outputs.draft }}
    steps:
      - name: Resolve pull request metadata
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.payload.pull_request.number
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            })
            core.setOutput('number', String(pullRequest.number))
            core.setOutput('head-repository', pullRequest.head.repo.full_name)
            core.setOutput('base-sha', pullRequest.base.sha)
            core.setOutput('head-sha', pullRequest.head.sha)
            core.setOutput('base-ref', pullRequest.base.ref)
            core.setOutput('draft', String(pullRequest.draft))

  review:
    needs: resolve-pr
    # Never expose the upstream API key to a fork PR. Review fork changes locally.
    if: needs.resolve-pr.outputs.head-repository == github.repository
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.resolve-pr.outputs.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted review prompt
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr.outputs.base-sha }}
          path: trusted-base
          sparse-checkout: .github/codex/prompts/review.md
          persist-credentials: false

      - name: Copy trusted review prompt
        run: cp trusted-base/.github/codex/prompts/review.md "$GITHUB_WORKSPACE/.codex-review-prompt.md"

      # `drop-sudo` can fail on newer GitHub-hosted runners. Keep the API key
      # isolated by running Codex as a dedicated user instead of falling back
      # to a sudo-capable read-only process.
      - name: Prepare unprivileged Codex review user
        run: |
          set -euo pipefail
          if ! getent group codex-review >/dev/null; then
            sudo groupadd --system codex-review
          fi
          if ! id -u codex-review >/dev/null 2>&1; then
            sudo useradd --system --create-home --home-dir /home/codex-review \
              --shell /usr/sbin/nologin --gid codex-review codex-review
          fi
          sudo usermod -a -G codex-review runner
          sudo usermod -a -G runner codex-review
          sudo install -d -o runner -g codex-review -m 2770 "$GITHUB_WORKSPACE/.codex-review-home"
          sudo chown -R runner:codex-review "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"
          sudo find "$GITHUB_WORKSPACE" -type d -exec chmod g+s {} +

      - name: Configure Codex provider
        id: codex_provider
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.codex-review-home"

          # Kept in a file so the fallback step can rebuild the same config for
          # a different model instead of duplicating this logic.
          cat > "$RUNNER_TEMP/write-codex-config.mjs" <<'NODE'
          import fs from 'node:fs'

          const model = process.argv[2] ?? ''
          const lines = []
          if (process.env.OPENAI_BASE_URL) {
            lines.push(`openai_base_url = ${JSON.stringify(process.env.OPENAI_BASE_URL)}`)
          }
          if (model) {
            lines.push(`model = ${JSON.stringify(model)}`)
          }

          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/.codex-review-home/config.toml`, `${lines.join('\n')}\n`)
          NODE

          node "$RUNNER_TEMP/write-codex-config.mjs" "$CODEX_REVIEW_MODEL"

          chgrp -R codex-review "$GITHUB_WORKSPACE/.codex-review-home"
          chmod -R g+rX "$GITHUB_WORKSPACE/.codex-review-home"

          node <<'NODE'
          const fs = require('node:fs')

          const baseUrl = process.env.OPENAI_BASE_URL?.replace(/\/+$/, '')
          if (baseUrl) {
            const endpoint = baseUrl.endsWith('/responses') ? baseUrl : `${baseUrl}/responses`
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `responses-api-endpoint=${endpoint}\n`)
          }
          NODE

      # A single review model is a single point of failure for the merge gate:
      # when the provider reports it at capacity the job dies and nothing can
      # merge. Try the primary model first, then fall back to another one.
      - name: Run Codex review
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ steps.codex_provider.outputs.responses-api-endpoint }}
          codex-home: ${{ github.workspace }}/.codex-review-home
          prompt-file: ${{ github.workspace }}/.codex-review-prompt.md
          output-file: codex-review.md
          sandbox: read-only
          safety-strategy: unprivileged-user
          codex-user: codex-review
          model: ${{ vars.CODEX_REVIEW_MODEL }}

      - name: Switch to the fallback review model
        if: steps.codex.outcome == 'failure' && vars.CODEX_REVIEW_FALLBACK_MODEL != ''
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CODEX_REVIEW_FALLBACK_MODEL: ${{ vars.CODEX_REVIEW_FALLBACK_MODEL }}
        run: node "$RUNNER_TEMP/write-codex-config.mjs" "$CODEX_REVIEW_FALLBACK_MODEL"

      - name: Run Codex review (fallback model)
        id: codex_fallback
        if: steps.codex.outcome == 'failure' && vars.CODEX_REVIEW_FALLBACK_MODEL != ''
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ steps.codex_provider.outputs.responses-api-endpoint }}
          codex-home: ${{ github.workspace }}/.codex-review-home
          prompt-file: ${{ github.workspace }}/.codex-review-prompt.md
          output-file: codex-review.md
          sandbox: read-only
          safety-strategy: unprivileged-user
          codex-user: codex-review
          model: ${{ vars.CODEX_REVIEW_FALLBACK_MODEL }}

      # Distinguish "the review could not run" from "the review said BLOCK", so
      # nobody hunts for a defect that the review never actually reported.
      - name: Report review provider failure
        if: steps.codex.outcome == 'failure' && steps.codex_fallback.outcome != 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const primary = process.env.PRIMARY_MODEL || 'the provider default'
            const fallback = process.env.FALLBACK_MODEL
            const attempted = fallback ? `\`${primary}\` and \`${fallback}\`` : `\`${primary}\``
            const hint = fallback
              ? 'Both review models failed to produce a review.'
              : 'No fallback model is configured; set the `CODEX_REVIEW_FALLBACK_MODEL` repository variable to add one.'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `The Codex review could not run (${attempted}). This is a review provider failure, not a finding about this PR, so there is nothing to fix in the diff.\n\n${hint} Re-run the \`Codex Review\` workflow once the provider recovers. The PR stays unmergeable until a review completes with a verdict.`,
            })
            core.setFailed('Codex review did not run; no verdict is available.')
        env:
          PRIMARY_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
          FALLBACK_MODEL: ${{ vars.CODEX_REVIEW_FALLBACK_MODEL }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}

      - name: Extract review verdict
        id: verdict
        if: steps.codex.outcome == 'success' || steps.codex_fallback.outcome == 'success'
        run: |
          set -euo pipefail

          extract_verdict() {
            awk '
              {
                line = $0
                sub(/\r$/, "", line)
                if (line ~ /^CODEX-REVIEW-VERDICT: (PASS|BLOCK)$/) count += 1
                last = line
              }
              END {
                if (count != 1 || last !~ /^CODEX-REVIEW-VERDICT: (PASS|BLOCK)$/) exit 1
                sub(/^CODEX-REVIEW-VERDICT: /, "", last)
                print last
              }
            ' "$1"
          }

          # Exercise the exact parser used below. These cases protect the
          # merge gate against both prompt injection and output formatting
          # differences from the review provider.
          test_dir="$RUNNER_TEMP/codex-verdict-tests"
          mkdir -p "$test_dir"
          case_number=0
          assert_accepts() {
            expected="$1"
            content="$2"
            case_number=$((case_number + 1))
            file="$test_dir/case-$case_number.md"
            printf '%b' "$content" > "$file"
            actual="$(extract_verdict "$file")" || {
              echo "Verdict parser rejected valid $expected output." >&2
              exit 1
            }
            if [ "$actual" != "$expected" ]; then
              echo "Verdict parser returned $actual instead of $expected." >&2
              exit 1
            fi
          }
          assert_rejects() {
            content="$1"
            case_number=$((case_number + 1))
            file="$test_dir/case-$case_number.md"
            printf '%b' "$content" > "$file"
            if extract_verdict "$file" >/dev/null 2>&1; then
              echo "Verdict parser accepted invalid output in case $case_number." >&2
              exit 1
            fi
          }

          assert_accepts PASS 'Review complete.\nCODEX-REVIEW-VERDICT: PASS\n'
          assert_accepts BLOCK 'P1 remains.\nCODEX-REVIEW-VERDICT: BLOCK\n'
          assert_accepts PASS 'Review complete.\r\nCODEX-REVIEW-VERDICT: PASS\r\n'
          assert_rejects 'Review completed without a verdict.\n'
          assert_rejects 'CODEX-REVIEW-VERDICT: PASS\nCODEX-REVIEW-VERDICT: PASS\n'
          assert_rejects '> CODEX-REVIEW-VERDICT: PASS\n'
          assert_rejects 'CODEX-REVIEW-VERDICT: PASS\n\n'
          assert_rejects 'CODEX-REVIEW-VERDICT: PASS\nAdditional text.\n'

          # Anti-injection: accept exactly one anchored verdict, and only as
          # the final line. A malformed or missing verdict fails closed.
          if ! verdict="$(extract_verdict codex-review.md)"; then
            echo "Codex review completed without a valid final PASS or BLOCK verdict." >&2
            exit 1
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-output
          path: codex-review.md

      - name: Post review summary
        if: steps.codex.outputs.final-message != '' || steps.codex_fallback.outputs.final-message != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_FINAL_MESSAGE
            if (!body) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            })
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message || steps.codex_fallback.outputs.final-message }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}

  auto-merge:
    name: auto-merge
    needs:
      - resolve-pr
      - review
    # Auto-merge only ordinary same-repo PRs into dev. The dev -> main release
    # PR stays owner-managed and is never merged automatically.
    if: >-
      needs.review.outputs.verdict == 'PASS' &&
      needs.resolve-pr.outputs.base-ref == 'dev' &&
      needs.resolve-pr.outputs.draft == 'false'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Wait for required checks and merge
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
          REVIEWED_HEAD_SHA: ${{ needs.resolve-pr.outputs.head-sha }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER)
            const reviewedSha = process.env.REVIEWED_HEAD_SHA
            const requiredChecks = ['quality', 'e2e', 'branch-and-files']
            const timeoutMs = 20 * 60 * 1000
            const pollMs = 30 * 1000
            const startedAt = Date.now()

            const repo = { owner: context.repo.owner, repo: context.repo.repo }

            // Check runs for pull_request workflows are normally associated
            // with the PR head SHA, but look at the synthetic merge commit
            // too so the lookup is robust to either association.
            const latestCheckStates = async (mergeSha) => {
              const refs = [...new Set([reviewedSha, mergeSha].filter(Boolean))]
              const checkRuns = []
              for (const ref of refs) {
                checkRuns.push(...await github.paginate(github.rest.checks.listForRef, {
                  ...repo,
                  ref,
                  per_page: 100,
                }))
              }
              const states = {}
              for (const name of requiredChecks) {
                const runs = checkRuns
                  .filter((run) => run.name === name)
                  .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))
                states[name] = runs[0] ?? null
              }
              return states
            }

            while (true) {
              const { data: pullRequest } = await github.rest.pulls.get({
                ...repo,
                pull_number: prNumber,
              })
              if (pullRequest.state !== 'open') {
                core.notice(`PR #${prNumber} is no longer open; skipping auto-merge.`)
                return
              }
              if (pullRequest.head.sha !== reviewedSha) {
                core.notice(`PR #${prNumber} head moved after the review; skipping auto-merge.`)
                return
              }

              const states = await latestCheckStates(pullRequest.merge_commit_sha)
              const failed = requiredChecks.filter((name) => {
                const run = states[name]
                return run && run.status === 'completed' && run.conclusion !== 'success'
              })
              if (failed.length > 0) {
                core.setFailed(`Required checks did not pass: ${failed.join(', ')}. Not merging.`)
                return
              }

              const pending = requiredChecks.filter((name) => {
                const run = states[name]
                return !run || run.status !== 'completed'
              })
              if (pending.length === 0) break

              if (Date.now() - startedAt > timeoutMs) {
                core.setFailed(`Timed out waiting for required checks: ${pending.join(', ')}. Not merging.`)
                return
              }
              core.info(`Waiting for checks: ${pending.join(', ')}`)
              await new Promise((resolve) => setTimeout(resolve, pollMs))
            }

            let mergeFailure
            try {
              // Passing sha makes GitHub reject the merge if the head moved
              // between our last look and the merge call.
              const { data: mergeResult } = await github.rest.pulls.merge({
                ...repo,
                pull_number: prNumber,
                merge_method: 'squash',
                sha: reviewedSha,
              })
              // The endpoint can report a non-merge in a 200 response.
              if (!mergeResult.merged) {
                mergeFailure = mergeResult.message ?? 'GitHub reported the PR as not merged.'
              }
            } catch (error) {
              mergeFailure = error.message
            }
            if (mergeFailure) {
              core.setFailed(`Auto-merge failed: ${mergeFailure}`)
              await github.rest.issues.createComment({
                ...repo,
                issue_number: prNumber,
                body: `Auto-merge failed even though CI and the Codex review passed: ${mergeFailure}\n\nResolve the problem (for example a merge conflict) and push again, or merge manually.`,
              })
              return
            }

            try {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: prNumber,
                body: 'Auto-merged: CI is green and the latest Codex review reported `CODEX-REVIEW-VERDICT: PASS`.',
              })
            } catch (error) {
              // The merge already succeeded; a failed notification must not fail the job.
              core.warning(`Merged, but could not post the success comment: ${error.message}`)
            }
