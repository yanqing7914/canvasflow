name: Codex Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    name: resolve-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.metadata.outputs.number }}
      head-repository: ${{ steps.metadata.outputs.head-repository }}
      base-sha: ${{ steps.metadata.outputs.base-sha }}
    steps:
      - name: Resolve pull request metadata
        id: metadata
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.payload.pull_request.number
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            })
            core.setOutput('number', String(pullRequest.number))
            core.setOutput('head-repository', pullRequest.head.repo.full_name)
            core.setOutput('base-sha', pullRequest.base.sha)

  review:
    needs: resolve-pr
    # Never expose the upstream API key to a fork PR. Review fork changes locally.
    if: needs.resolve-pr.outputs.head-repository == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ needs.resolve-pr.outputs.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted review prompt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-pr.outputs.base-sha }}
          path: trusted-base
          sparse-checkout: .github/codex/prompts/review.md
          persist-credentials: false

      - name: Copy trusted review prompt
        run: cp trusted-base/.github/codex/prompts/review.md "$RUNNER_TEMP/review-prompt.md"

      - name: Configure Codex provider
        id: codex_provider
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          node <<'NODE'
          const fs = require('node:fs')

          const lines = []
          if (process.env.OPENAI_BASE_URL) {
            lines.push(`openai_base_url = ${JSON.stringify(process.env.OPENAI_BASE_URL)}`)
          }
          if (process.env.CODEX_REVIEW_MODEL) {
            lines.push(`model = ${JSON.stringify(process.env.CODEX_REVIEW_MODEL)}`)
          }

          fs.writeFileSync(`${process.env.RUNNER_TEMP}/codex-home/config.toml`, `${lines.join('\n')}\n`)

          const baseUrl = process.env.OPENAI_BASE_URL?.replace(/\/+$/, '')
          if (baseUrl) {
            const endpoint = baseUrl.endsWith('/responses') ? baseUrl : `${baseUrl}/responses`
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `responses-api-endpoint=${endpoint}\n`)
          }
          NODE

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@b11346a6fa031e2e164ab4b7c7ea201afffd7d59 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ steps.codex_provider.outputs.responses-api-endpoint }}
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ runner.temp }}/review-prompt.md
          output-file: codex-review.md
          sandbox: read-only
          model: ${{ vars.CODEX_REVIEW_MODEL }}

      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-review-output
          path: codex-review.md

      - name: Post review summary
        if: steps.codex.outputs.final-message != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_FINAL_MESSAGE
            if (!body) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            })
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
