name: Codex Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs do not receive secrets automatically. Review those from the owner's
    # machine or dispatch this workflow manually after checking the head ref.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Codex provider
        id: codex_provider
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          node <<'NODE'
          const fs = require('node:fs')

          const lines = []
          if (process.env.OPENAI_BASE_URL) {
            lines.push(`openai_base_url = ${JSON.stringify(process.env.OPENAI_BASE_URL)}`)
          }
          if (process.env.CODEX_REVIEW_MODEL) {
            lines.push(`model = ${JSON.stringify(process.env.CODEX_REVIEW_MODEL)}`)
          }

          fs.writeFileSync(`${process.env.RUNNER_TEMP}/codex-home/config.toml`, `${lines.join('\n')}\n`)

          const baseUrl = process.env.OPENAI_BASE_URL?.replace(/\/+$/, '')
          if (baseUrl) {
            const endpoint = baseUrl.endsWith('/responses') ? baseUrl : `${baseUrl}/responses`
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `responses-api-endpoint=${endpoint}\n`)
          }
          NODE

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ steps.codex_provider.outputs.responses-api-endpoint }}
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review.md
          sandbox: read-only
          model: ${{ vars.CODEX_REVIEW_MODEL }}

      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-output
          path: codex-review.md

      - name: Post review summary
        if: steps.codex.outputs.final-message != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_FINAL_MESSAGE
            if (!body) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            })
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
