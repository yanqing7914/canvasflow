name: Repository Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  branch-and-files:
    name: branch-and-files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch policy
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          UPSTREAM_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$BASE_BRANCH" = "main" ]; then
            if [ "$HEAD_BRANCH" != "dev" ] || [ "$HEAD_REPOSITORY" != "$UPSTREAM_REPOSITORY" ]; then
              echo "Only the upstream dev -> main release PR may target main."
              exit 1
            fi
          fi
          if [ "$BASE_BRANCH" = "dev" ] && ! printf '%s' "$HEAD_BRANCH" | grep -Eq '^(feat|fix|test|chore)/[a-z0-9._-]+$'; then
            echo "Normal PRs into dev must use feat/*, fix/*, test/*, or chore/* branches."
            exit 1
          fi

      - name: Reject secret-looking files
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed_files" | grep -Eiq '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$|id_rsa|id_ed25519)'; then
            echo "Credential or environment files are not allowed in pull requests."
            exit 1
          fi

      - name: Scan changed text for private credentials
        run: |
          set -euo pipefail
          if git diff --no-ext-diff --text --unified=0 \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -nEI '^\+.*(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16})'; then
            echo 'Private key or AWS access-key material found in changed text.' >&2
            exit 1
          fi
